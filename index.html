<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tic-Tac-Toe: IMPOSSIBLE Mode | Unbeatable Bot</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #0a0f1a 0%, #05080f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, 'Roboto', sans-serif;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            border-radius: 64px;
            padding: 25px 20px 30px 20px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.7), inset 0 1px 2px rgba(255,50,50,0.2);
            border: 1px solid rgba(255,80,80,0.4);
        }

        .game-panel {
            background: #11161f;
            border-radius: 48px;
            padding: 20px;
            box-shadow: inset 0 2px 5px #000000, 0 10px 20px rgba(0,0,0,0.5);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            background: #0a0e14;
            padding: 12px 20px;
            border-radius: 60px;
            margin-bottom: 25px;
            color: #ffcf9a;
            font-weight: bold;
            gap: 15px;
            flex-wrap: wrap;
            border-bottom: 2px solid #ff444466;
        }

        .balance {
            background: #1e3a2f;
            padding: 5px 16px;
            border-radius: 40px;
            font-size: 1.4rem;
            letter-spacing: 1px;
            box-shadow: inset 0 -1px 0 #5fa06e, 0 3px 6px black;
        }

        .balance span {
            font-size: 1.8rem;
            font-weight: 800;
            color: #f9e45b;
            margin-right: 5px;
        }

        .loss-counter {
            background: #4a2020;
            padding: 5px 16px;
            border-radius: 40px;
            font-size: 1.2rem;
        }

        .loss-counter span {
            font-weight: 800;
            font-size: 1.6rem;
            color: #ff8888;
        }

        .penalty-timer {
            background: #2c1f2a;
            padding: 5px 15px;
            border-radius: 40px;
            font-family: monospace;
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffaa77;
        }

        .difficulty-badge {
            background: #8b0000;
            padding: 5px 16px;
            border-radius: 40px;
            font-size: 0.9rem;
            letter-spacing: 1px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            background: #0a0e14;
            padding: 18px;
            border-radius: 48px;
            margin-bottom: 25px;
            box-shadow: inset 0 0 8px #000000, 0 10px 20px rgba(0,0,0,0.5);
        }

        .cell {
            aspect-ratio: 1 / 1;
            background: #1f2a2f;
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            font-weight: 800;
            color: white;
            text-shadow: 0 4px 8px black;
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: 0 6px 0 #0a0f12;
            background: radial-gradient(circle at 30% 25%, #2e3e42, #141c20);
            border: 1px solid #ff666622;
        }

        .cell:active {
            transform: scale(0.96);
            box-shadow: 0 2px 0 #0a0f12;
        }

        .cell.disabled, .cell.X, .cell.O {
            cursor: default;
            transform: none;
        }

        .cell.X {
            color: #88ddff;
            text-shadow: 0 0 6px #0088ff;
        }
        .cell.O {
            color: #ffa366;
            text-shadow: 0 0 6px #ff6600;
        }

        .info-area {
            text-align: center;
            margin-bottom: 20px;
        }

        .status {
            font-size: 1.5rem;
            font-weight: bold;
            background: #000000aa;
            display: inline-block;
            padding: 8px 24px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            color: #ffddbb;
            font-family: monospace;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 10px;
        }

        button {
            background: #2a3a44;
            border: none;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 10px 24px;
            border-radius: 60px;
            color: #f0f0f0;
            cursor: pointer;
            transition: 0.1s linear;
            font-family: inherit;
            box-shadow: 0 4px 0 #11181f;
        }

        button:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #11181f;
        }

        .ads-btn {
            background: #aa4f1a;
            box-shadow: 0 4px 0 #6e2e0c;
            color: #fff0c0;
        }

        .reset-btn {
            background: #3f4055;
        }

        .board.disabled .cell {
            filter: grayscale(0.6);
            cursor: not-allowed;
            opacity: 0.5;
            pointer-events: none;
        }
        
        .warning-glow {
            animation: pulseRed 1s infinite;
        }
        
        @keyframes pulseRed {
            0% { text-shadow: 0 0 0px red; }
            100% { text-shadow: 0 0 6px #ff0000; }
        }
        
        @media (max-width: 500px) {
            .cell {
                font-size: 2.8rem;
            }
            .stats {
                justify-content: center;
            }
        }
        
        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #000000dd;
            backdrop-filter: blur(12px);
            color: #ffcc99;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: bold;
            z-index: 999;
            pointer-events: none;
            transition: 0.2s;
            white-space: nowrap;
            font-family: monospace;
            border-left: 4px solid #ff6600;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="game-panel">
        <div class="stats">
            <div class="balance">💰 <span id="balanceAmount">0.00</span> WIN</div>
            <div class="loss-counter">💀 LOSS: <span id="lossCount">0</span> / 3</div>
            <div class="difficulty-badge">🔥 IMPOSSIBLE MODE 🔥</div>
            <div class="penalty-timer" id="penaltyDisplay">⏱️ READY</div>
        </div>

        <div class="board" id="board"></div>

        <div class="info-area">
            <div class="status" id="statusMsg">☠️ BOT IS PERFECT ☠️</div>
            <div class="action-buttons">
                <button class="reset-btn" id="resetGameBtn">💀 Surrender / New Game</button>
                <button class="ads-btn" id="watchAdBtn">📺 Watch Ad → Unlock (skip penalty)</button>
            </div>
        </div>
    </div>
</div>
<div id="toastMsg" class="toast-msg" style="opacity:0;">⚡</div>

<!-- Your ad SDK -->
<script src='//libtl.com/sdk.js' data-zone='11068102' data-sdk='show_11068102'></script>

<script>
    // =============== IMPOSSIBLE TIC-TAC-TOE ===============
    // Bot uses perfect minimax algorithm - you can NEVER win.
    // The best you can achieve is a draw. Winning is nearly impossible.
    // To make it "very hard to play" - bot never makes mistakes.
    
    let board = Array(9).fill(null);
    let currentPlayer = 'X';       // X = human, O = bot (unbeatable)
    let gameActive = true;
    let winState = false;
    
    // Economy & Penalty (same as requested)
    let balance = 0.0;
    let lossStreak = 0;
    let isPenaltyLocked = false;
    let penaltyEndTime = null;
    let penaltyInterval = null;
    
    // DOM elements
    const boardContainer = document.getElementById('board');
    const balanceSpan = document.getElementById('balanceAmount');
    const lossCountSpan = document.getElementById('lossCount');
    const penaltyDisplaySpan = document.getElementById('penaltyDisplay');
    const statusMsgDiv = document.getElementById('statusMsg');
    const resetBtn = document.getElementById('resetGameBtn');
    const watchAdBtn = document.getElementById('watchAdBtn');
    const toastEl = document.getElementById('toastMsg');
    
    function showToast(msg, duration = 2000) {
        toastEl.textContent = msg;
        toastEl.style.opacity = '1';
        setTimeout(() => { toastEl.style.opacity = '0'; }, duration);
    }
    
    function updateStatsUI() {
        balanceSpan.textContent = balance.toFixed(2);
        lossCountSpan.textContent = lossStreak;
    }
    
    function updatePenaltyUI() {
        if (!isPenaltyLocked) {
            penaltyDisplaySpan.innerHTML = "⏱️ READY";
            return;
        }
        if (penaltyEndTime) {
            const now = Date.now();
            const remainingSec = Math.max(0, Math.floor((penaltyEndTime - now) / 1000));
            if (remainingSec <= 0) {
                clearPenaltyLock();
                return;
            }
            const minutes = Math.floor(remainingSec / 60);
            const seconds = remainingSec % 60;
            penaltyDisplaySpan.innerHTML = `⛔ ${minutes}:${seconds.toString().padStart(2,'0')}`;
        } else {
            penaltyDisplaySpan.innerHTML = "⛔ LOCKED";
        }
    }
    
    function clearPenaltyLock() {
        if (penaltyInterval) { clearInterval(penaltyInterval); penaltyInterval = null; }
        isPenaltyLocked = false;
        penaltyEndTime = null;
        lossStreak = 0;
        updateStatsUI();
        updatePenaltyUI();
        enableBoardByLockState();
        if (!gameActive || winState !== false || checkDraw(board)) {
            resetBoardGameOnly();
        } else {
            updateStatusMessage();
        }
        showToast("✅ Penalty cleared! But the bot is still IMPOSSIBLE. Good luck.", 2200);
    }
    
    function applyPenaltyLock() {
        if (isPenaltyLocked) return;
        isPenaltyLocked = true;
        penaltyEndTime = Date.now() + 30 * 60 * 1000;
        updatePenaltyUI();
        if (penaltyInterval) clearInterval(penaltyInterval);
        penaltyInterval = setInterval(() => {
            if (!isPenaltyLocked) {
                if (penaltyInterval) clearInterval(penaltyInterval);
                penaltyInterval = null;
                return;
            }
            if (penaltyEndTime && Date.now() >= penaltyEndTime) clearPenaltyLock();
            else updatePenaltyUI();
        }, 500);
        enableBoardByLockState();
        statusMsgDiv.textContent = "🔒 PENALTY: 30 min wait OR watch ad!";
        showToast("THREE LOSSES! You are locked for 30 minutes. Watch ad to resume.", 3500);
    }
    
    // ---------- IMPOSSIBLE AI: PERFECT MINIMAX ----------
    // This bot never loses. It will force a win if possible, else a draw.
    function minimax(newBoard, depth, isMaximizing) {
        const winner = checkWinnerOnBoard(newBoard);
        if (winner === 'O') return 10 - depth;   // bot wins
        if (winner === 'X') return -10 + depth;  // player wins
        if (isBoardFull(newBoard)) return 0;
        
        if (isMaximizing) {
            let best = -Infinity;
            for (let i = 0; i < 9; i++) {
                if (!newBoard[i]) {
                    newBoard[i] = 'O';
                    let score = minimax(newBoard, depth + 1, false);
                    newBoard[i] = null;
                    best = Math.max(score, best);
                }
            }
            return best;
        } else {
            let best = Infinity;
            for (let i = 0; i < 9; i++) {
                if (!newBoard[i]) {
                    newBoard[i] = 'X';
                    let score = minimax(newBoard, depth + 1, true);
                    newBoard[i] = null;
                    best = Math.min(score, best);
                }
            }
            return best;
        }
    }
    
    function checkWinnerOnBoard(boardArr) {
        const lines = [
            [0,1,2], [3,4,5], [6,7,8],
            [0,3,6], [1,4,7], [2,5,8],
            [0,4,8], [2,4,6]
        ];
        for (let line of lines) {
            const [a,b,c] = line;
            if (boardArr[a] && boardArr[a] === boardArr[b] && boardArr[a] === boardArr[c]) {
                return boardArr[a];
            }
        }
        return null;
    }
    
    function isBoardFull(boardArr) {
        return boardArr.every(cell => cell !== null);
    }
    
    function getBestBotMove(currentBoard) {
        let bestScore = -Infinity;
        let bestMove = -1;
        for (let i = 0; i < 9; i++) {
            if (!currentBoard[i]) {
                let boardCopy = [...currentBoard];
                boardCopy[i] = 'O';
                let score = minimax(boardCopy, 0, false);
                if (score > bestScore) {
                    bestScore = score;
                    bestMove = i;
                }
            }
        }
        return bestMove;
    }
    
    // Classic winner/draw check using current board
    function checkWinnerClassic() {
        return checkWinnerOnBoard(board);
    }
    
    function checkDrawClassic() {
        return isBoardFull(board);
    }
    
    // End game with rewards / penalties
    function endGame(winner) {
        gameActive = false;
        if (winner === 'X') {
            winState = 'X';
            balance += 0.1;
            updateStatsUI();
            if (lossStreak !== 0) {
                lossStreak = 0;
                updateStatsUI();
            }
            showToast("⚡ MIRACLE! You defeated the impossible bot! +$0.10 ⚡", 2500);
            statusMsgDiv.textContent = "✨ IMPOSSIBLE VICTORY! +0.1$ ✨";
        } 
        else if (winner === 'O') {
            winState = 'O';
            lossStreak++;
            updateStatsUI();
            showToast(`💀 BOT WINS (perfection). Loss ${lossStreak}/3 💀`, 2000);
            statusMsgDiv.textContent = "🤖 BOT WINS... try harder? 🤖";
            if (lossStreak >= 3) {
                applyPenaltyLock();
                enableBoardByLockState();
                updateStatusMessage();
                renderBoard();
                return;
            }
        }
        else if (winner === null && checkDrawClassic()) {
            winState = false;
            statusMsgDiv.textContent = "😮‍💨 DRAW... bot is unbeatable. No reward, no loss.";
            showToast("Draw... you survived but didn't win. Bot remains undefeated.", 2000);
        }
        updateStatusMessage();
        renderBoard();
        enableBoardByLockState();
    }
    
    // Bot move using perfect minimax
    function botMove() {
        if (!gameActive) return;
        if (currentPlayer !== 'O') return;
        if (isPenaltyLocked) return;
        
        const bestIndex = getBestBotMove(board);
        if (bestIndex !== -1 && board[bestIndex] === null) {
            makeMove(bestIndex, 'O');
        } else {
            // fallback (should never happen on non-full board)
            for (let i=0; i<9; i++) {
                if (!board[i]) { makeMove(i, 'O'); break; }
            }
        }
    }
    
    function makeMove(index, player) {
        if (!gameActive) return false;
        if (isPenaltyLocked) return false;
        if (board[index] !== null) return false;
        if (currentPlayer !== player) return false;
        
        board[index] = player;
        renderBoard();
        
        const winner = checkWinnerClassic();
        if (winner) {
            endGame(winner);
            return true;
        }
        if (checkDrawClassic()) {
            endGame(null);
            return true;
        }
        
        currentPlayer = (currentPlayer === 'X') ? 'O' : 'X';
        updateStatusMessage();
        renderBoard();
        
        if (gameActive && currentPlayer === 'O' && !isPenaltyLocked) {
            setTimeout(() => {
                if (gameActive && currentPlayer === 'O' && !isPenaltyLocked) {
                    botMove();
                }
            }, 180);
        }
        return true;
    }
    
    function humanMove(index) {
        if (isPenaltyLocked) {
            showToast("🔒 LOCKED! Watch ad to continue.", 1500);
            return false;
        }
        if (!gameActive) {
            showToast("Game over. Press 'New Game' to challenge bot again.", 1500);
            return false;
        }
        if (currentPlayer !== 'X') return false;
        if (board[index] !== null) return false;
        makeMove(index, 'X');
        return true;
    }
    
    function resetBoardGameOnly() {
        board = Array(9).fill(null);
        currentPlayer = 'X';
        gameActive = true;
        winState = false;
        renderBoard();
        updateStatusMessage();
        enableBoardByLockState();
    }
    
    function resetGame() {
        if (isPenaltyLocked) {
            showToast("Cannot reset while locked! Watch ad to unlock first.", 2000);
            board = Array(9).fill(null);
            renderBoard();
            gameActive = true;
            currentPlayer = 'X';
            winState = false;
            updateStatusMessage();
            enableBoardByLockState();
            return;
        }
        board = Array(9).fill(null);
        currentPlayer = 'X';
        gameActive = true;
        winState = false;
        renderBoard();
        updateStatusMessage();
        enableBoardByLockState();
        showToast("New game. Bot is PERFECT. Can you even draw?", 1800);
    }
    
    function updateStatusMessage() {
        if (isPenaltyLocked) {
            statusMsgDiv.innerHTML = "⛔ PENALTY ACTIVE ⛔ Watch ad or wait";
            return;
        }
        if (!gameActive) {
            if (winState === 'X') statusMsgDiv.innerHTML = "🏆 YOU WON (UNBELIEVABLE) +0.1 🏆";
            else if (winState === 'O') statusMsgDiv.innerHTML = "💀 BOT PERFECTION 💀 Loss streak rising";
            else if (checkDrawClassic()) statusMsgDiv.innerHTML = "♾️ DRAW. Bot cannot be beaten. ♾️";
            else statusMsgDiv.innerHTML = "Game finished";
            return;
        }
        if (currentPlayer === 'X') {
            statusMsgDiv.innerHTML = "😰 YOUR TURN (X) - Bot never loses... 😰";
        } else {
            statusMsgDiv.innerHTML = "🤖 BOT THINKING (PERFECT AI) 🤖";
        }
    }
    
    function enableBoardByLockState() {
        if (isPenaltyLocked) boardContainer.classList.add('disabled');
        else boardContainer.classList.remove('disabled');
    }
    
    function renderBoard() {
        boardContainer.innerHTML = '';
        for (let i = 0; i < 9; i++) {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            if (board[i] === 'X') cell.classList.add('X');
            if (board[i] === 'O') cell.classList.add('O');
            cell.textContent = board[i] || '';
            cell.addEventListener('click', (function(idx) {
                return function() { humanMove(idx); };
            })(i));
            boardContainer.appendChild(cell);
        }
        if (isPenaltyLocked) boardContainer.classList.add('disabled');
        else boardContainer.classList.remove('disabled');
    }
    
    // AD INTEGRATION with your script (Rewarded)
    async function triggerRewardedAd() {
        if (typeof window.show_11068102 !== 'function') {
            showToast("Ad SDK loading, try again in a moment.", 2000);
            return false;
        }
        try {
            showToast("Loading ad... Watch full ad to unlock penalty.", 1500);
            await window.show_11068102();   // Rewarded interstitial
            if (isPenaltyLocked) {
                clearPenaltyLock();
                showToast("✅ Ad watched! Penalty removed. Bot still impossible. Try your luck.", 2800);
                if (!gameActive || winState !== false) resetBoardGameOnly();
                else renderBoard();
            } else {
                showToast("Thanks! No penalty active. Good luck against unbeatable AI.", 2000);
            }
            return true;
        } catch (e) {
            console.error("Ad error/skip", e);
            showToast("Ad failed or not completed. Penalty not removed.", 2500);
            return false;
        }
    }
    
    function onWatchAdClick() {
        if (typeof window.show_11068102 === 'function') {
            triggerRewardedAd().catch(err => showToast("Ad error, try later", 1500));
        } else {
            showToast("Ad system not ready. Please wait.", 1500);
        }
    }
    
    // HARD MODE: Also show warning messages about difficulty
    function init() {
        renderBoard();
        updateStatsUI();
        lossStreak = 0;
        balance = 0.0;
        isPenaltyLocked = false;
        penaltyEndTime = null;
        gameActive = true;
        currentPlayer = 'X';
        winState = false;
        board = Array(9).fill(null);
        updatePenaltyUI();
        updateStatusMessage();
        enableBoardByLockState();
        resetBtn.addEventListener('click', () => resetGame());
        watchAdBtn.addEventListener('click', () => onWatchAdClick());
        showToast("🔥 IMPOSSIBLE MODE: Bot uses perfect AI. You CANNOT win. Only draws. 🔥", 4000);
        statusMsgDiv.innerHTML = "☠️ UNBEATABLE BOT ACTIVE ☠️";
    }
    
    init();
</script>
</body>
  </html>
